# Repo-spesifikke kommandoer for scripts/verify.sh.
# Tilgjengelig: run "<navn>" <dir> <kommando...>   ROOT = repo-rot

# Scopes som "all" kjører. Integrasjonstesten holdes utenfor fordi den krever at
# SPX Solo kjører på 127.0.0.1:5656 med kontroller-siden åpen — noe bare et menneske
# setter opp. Den kjøres eksplisitt med: scripts/verify.sh integration
# verify.sh setter $SCOPE før denne fila sources, så vi kan bytte listen her.
SCOPES="lint unit build"
[ "${SCOPE:-all}" = integration ] && SCOPES="integration"

# Enhetstester heter src/__tests__/*.unit.test.js, integrasjonstester
# src/__integration__/*.spx.test.js. verify.sh kaller node uten skall, så
# glob-mønsteret sendes i hermetegn og ekspanderes av node selv. Det krever
# Node 20 eller nyere på utviklermaskinen; modulens egen runtime er node18,
# men testene kjøres aldri inne i Companion.

verify_lint() {
  run "prettier --check" "$ROOT" npx prettier --check .
}

verify_unit() {
  run "unit tests" "$ROOT" node --test "src/__tests__/*.unit.test.js"
}

verify_build() {
  run "companion-module-build" "$ROOT" npx companion-module-build
}

verify_integration() {
  run "SPX svarer på 127.0.0.1:5656" "$ROOT" \
    curl -sf -m 5 -o /dev/null http://127.0.0.1:5656/api/v1/version
  run "integration tests" "$ROOT" node --test "src/__integration__/*.spx.test.js"
}

# Én testfil (absolutt sti).
focus_cmd() {
  local abs="$1"
  case "$abs" in
    "$ROOT/src/"*) run "focus $(basename "$abs")" "$ROOT" node --test "$abs" ;;
    *) return 1 ;;
  esac
}
